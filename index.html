<!-- Robust Player Container with Fallback Overlay -->
<div class="video-container" id="player-wrapper">
  <div id="youtube-player"></div>
  
  <!-- Fallback UI (Hidden by Default) -->
  <div id="player-fallback" class="hidden-fallback">
    <p>This stream restricts inline embedding.</p>
    <a id="external-link" href="#" target="_blank" rel="noopener">
      Watch Directly on YouTube ↗
    </a>
  </div>
</div>

<script>
  let player;
  const currentVideoId = "YOUR_LIVE_VIDEO_ID"; // Replace with target ID

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
      videoId: currentVideoId,
      playerVars: {
        'playsinline': 1,
        'origin': window.location.origin
      },
      events: {
        'onError': onPlayerError
      }
    });
  }

  function onPlayerError(event) {
    // Error 101/150: Owner disallowed embedding
    // Error 100: Video removed/not found
    console.warn("YouTube Embed Error:", event.data);
    
    // Hide iframe, display fallback link
    document.getElementById('youtube-player').style.display = 'none';
    const fallback = document.getElementById('player-fallback');
    const link = document.getElementById('external-link');
    
    link.href = `https://www.youtube.com/watch?v=${currentVideoId}`;
    fallback.style.display = 'flex';
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
