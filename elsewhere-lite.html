<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elsewhere · In-room television</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #080b13;
    --ink-2: #0d1220;
    --panel: rgba(255, 248, 235, 0.035);
    --bone: #ede5d6;
    --bone-dim: #b9b1a3;
    --muted: #7f7a72;
    --gold: #c9a96a;
    --gold-soft: rgba(201, 169, 106, 0.38);
    --gold-faint: rgba(201, 169, 106, 0.14);
    --line: rgba(237, 229, 214, 0.09);
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  /* One rem is 16px on a 1920×1080 screen and scales with the viewport, so
     the layout holds on any TV browser resolution. */
  html { font-size: min(calc(100vw / 120), calc(100vh / 67.5)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--bone); }
  body {
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 70% 60% at 78% 18%, rgba(46, 62, 102, 0.34), transparent 70%),
      radial-gradient(ellipse 60% 50% at 10% 100%, rgba(201, 169, 106, 0.06), transparent 70%),
      linear-gradient(180deg, var(--ink-2), var(--ink));
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: var(--mono); }
  .view { position: fixed; inset: 0; display: none; }
  .view.active { display: block; }

  /* ---------- welcome ---------- */
  #welcome { display: none; }
  #welcome.active { display: flex; flex-direction: column; justify-content: center; padding: 0 9rem; }
  .w-eyebrow { font: 500 0.95rem/1 var(--mono); letter-spacing: 0.32em; color: var(--gold); text-transform: uppercase; }
  .w-greeting { font-weight: 400; font-size: 8.5rem; line-height: 0.95; margin: 2.2rem 0 0; letter-spacing: -0.01em; }
  .w-greeting em { font-style: italic; color: var(--gold); }
  .w-rule { width: 7rem; height: 1px; background: var(--gold); margin: 3rem 0 2.2rem; }
  .w-line { font-size: 2.1rem; color: var(--bone-dim); font-style: italic; }
  .w-meta { margin-top: 1rem; font: 400 1.05rem/1.6 var(--mono); color: var(--muted); letter-spacing: 0.08em; }
  .w-actions { display: flex; gap: 1.5rem; margin-top: 4rem; }
  .w-btn {
    min-width: 19rem; padding: 1.25rem 2.2rem; border: 1px solid var(--line);
    font: 500 1.05rem/1 var(--mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--bone-dim);
    text-align: left; transition: border-color .2s, color .2s, background .2s;
  }
  .w-btn small { display: block; margin-top: 0.7rem; font: italic 400 1.45rem/1.1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .w-btn.focus { border-color: var(--gold); color: var(--gold); background: var(--gold-faint); }
  .w-btn.focus small { color: var(--bone); }
  .w-clocks { position: absolute; left: 9rem; right: 9rem; bottom: 4.5rem; display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 1.6rem; }
  .w-clock { font: 400 0.85rem/1.5 var(--mono); color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .w-clock b { display: block; font-weight: 400; font-size: 1.5rem; letter-spacing: 0.06em; color: var(--bone-dim); }
  .w-hint { position: absolute; right: 9rem; top: 4.5rem; font: 400 0.85rem/1 var(--mono); letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
  .w-hint kbd, .hint kbd { font: inherit; color: var(--gold); border: 1px solid var(--gold-soft); padding: 0.2rem 0.45rem; margin: 0 0.25rem; }

  /* ---------- guide ---------- */
  .g-top { position: absolute; left: 5rem; right: 5rem; top: 3.2rem; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 2rem; letter-spacing: 0.42em; font-weight: 500; text-transform: uppercase; }
  .brand span { display: block; font: 400 0.75rem/1 var(--mono); letter-spacing: 0.32em; color: var(--gold); margin-top: 0.55rem; }
  .g-right { display: flex; align-items: center; gap: 2.5rem; }
  .g-clock { font: 400 1.1rem/1.3 var(--mono); color: var(--bone-dim); text-align: right; letter-spacing: 0.1em; }
  .g-clock small { display: block; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; }
  .chip { font: 500 0.85rem/1 var(--mono); letter-spacing: 0.2em; text-transform: uppercase; padding: 0.85rem 1.2rem; border: 1px solid var(--line); color: var(--bone-dim); }
  .chip.focus { border-color: var(--gold); color: var(--gold); background: var(--gold-faint); }
  .chip .dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); margin-right: 0.7rem; vertical-align: 0.08rem; }
  .chip.on .dot { background: var(--gold); }

  .tabs { position: absolute; left: 5rem; right: 5rem; top: 8.6rem; display: flex; gap: 3.2rem; border-bottom: 1px solid var(--line); }
  .tab { padding: 0 0 1rem; font-size: 1.7rem; color: var(--muted); position: relative; letter-spacing: 0.02em; }
  .tab sup { font: 400 0.75rem/1 var(--mono); margin-left: 0.4rem; letter-spacing: 0.1em; }
  .tab.active { color: var(--bone); }
  .tab.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gold); }
  .tab.focus { color: var(--gold); }

  .list { position: absolute; left: 5rem; width: 50rem; top: 13.2rem; bottom: 5.6rem; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 90%, transparent); mask-image: linear-gradient(180deg, #000 90%, transparent); }
  .list-inner { position: relative; }
  .country { display: flex; justify-content: space-between; align-items: baseline; padding: 1.5rem 1.2rem 0.5rem; font: 500 0.8rem/1 var(--mono); letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); opacity: 0.8; }
  .country span { color: var(--muted); letter-spacing: 0.14em; }
  .row { display: grid; grid-template-columns: 3.6rem 1fr auto; align-items: center; gap: 1rem; padding: 0.8rem 1.2rem; border-left: 2px solid transparent; }
  .row .num { font: 400 0.85rem/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; }
  .row .name { font-size: 1.75rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name small { font: 400 0.78rem/1 var(--mono); color: var(--muted); letter-spacing: 0.14em; margin-left: 0.9rem; text-transform: uppercase; vertical-align: 0.2rem; }
  .row .meta { font: 400 0.85rem/1 var(--mono); color: var(--muted); letter-spacing: 0.08em; text-align: right; white-space: nowrap; }
  .row .tag { text-transform: uppercase; border: 1px solid var(--gold-soft); color: var(--gold); padding: 0.2rem 0.45rem; margin-right: 0.8rem; font-size: 0.7rem; letter-spacing: 0.16em; }
  .row.focus { border-left-color: var(--gold); background: linear-gradient(90deg, var(--gold-faint), transparent 85%); }
  .row.focus .name { color: var(--gold); }
  .row.focus .meta, .row.focus .num { color: var(--bone-dim); }
  .row.dim .name { color: var(--bone-dim); }

  .card { position: absolute; left: 60rem; right: 5rem; top: 13.2rem; bottom: 5.6rem; padding: 3rem 3.4rem; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .card::before { content: ''; position: absolute; left: -1px; top: -1px; width: 4rem; height: 1px; background: var(--gold); }
  .c-eyebrow { font: 500 0.85rem/1 var(--mono); letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); }
  .c-name { font-size: 4.4rem; line-height: 1; margin: 1.4rem 0 0; font-weight: 500; }
  .c-cat { font-size: 1.7rem; font-style: italic; color: var(--bone-dim); margin-top: 0.8rem; }
  .c-time { display: flex; align-items: baseline; gap: 1.4rem; margin-top: 2.4rem; padding: 1.6rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .c-time b { font: 400 3.4rem/1 var(--mono); letter-spacing: 0.02em; color: var(--bone); }
  .c-time span { font: 400 0.9rem/1.5 var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .c-facts { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem 2rem; margin-top: 1.8rem; font: 400 0.95rem/1.35 var(--mono); }
  .c-facts dt { color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.78rem; padding-top: 0.15rem; }
  .c-facts dd { margin: 0; color: var(--bone-dim); }
  .c-desc { font-size: 1.6rem; line-height: 1.4; color: var(--bone); margin-top: 1.8rem; }
  .c-notice { font-size: 1.4rem; line-height: 1.4; color: var(--bone-dim); font-style: italic; margin-top: 0.9rem; }
  .c-foot { margin-top: auto; padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; font: 400 0.85rem/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .c-foot .go { color: var(--gold); }
  .c-foot .go kbd { font: inherit; border: 1px solid var(--gold-soft); padding: 0.3rem 0.55rem; margin-right: 0.6rem; }

  .hint { position: absolute; left: 5rem; right: 5rem; bottom: 2.4rem; display: flex; justify-content: space-between; font: 400 0.8rem/1 var(--mono); letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
  .status { color: var(--muted); }

  /* ---------- player ---------- */
  #player { background: #000; }
  #screen { position: absolute; inset: 0; }
  #screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .tuning { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, #111726, #000 70%); transition: opacity .6s; }
  .tuning.gone { opacity: 0; pointer-events: none; }
  .tuning .t-eyebrow { font: 500 0.9rem/1 var(--mono); letter-spacing: 0.32em; color: var(--gold); text-transform: uppercase; }
  .tuning .t-name { font-size: 5rem; margin-top: 1.4rem; }
  .tuning .t-copy { font-size: 1.7rem; font-style: italic; color: var(--bone-dim); margin-top: 1rem; max-width: 60rem; line-height: 1.4; }
  .tuning .t-actions { margin-top: 2.4rem; font: 400 0.9rem/1 var(--mono); letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
  .tuning .t-actions kbd { font: inherit; color: var(--gold); border: 1px solid var(--gold-soft); padding: 0.2rem 0.45rem; margin: 0 0.3rem; }
  .pulse { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--gold); margin: 2.4rem auto 0; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .lower { position: absolute; left: 0; right: 0; bottom: 0; padding: 6rem 5rem 3.2rem; background: linear-gradient(0deg, rgba(5, 7, 12, 0.94), rgba(5, 7, 12, 0.7) 55%, transparent); display: flex; align-items: flex-end; justify-content: space-between; opacity: 0; transform: translateY(1rem); transition: opacity .35s, transform .35s; pointer-events: none; }
  .lower.show { opacity: 1; transform: none; pointer-events: auto; }
  .l-num { font: 400 1rem/1 var(--mono); color: var(--gold); letter-spacing: 0.24em; }
  .l-name { font-size: 3.6rem; line-height: 1; margin-top: 0.8rem; font-weight: 500; }
  .l-meta { font: 400 1rem/1.4 var(--mono); color: var(--bone-dim); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 1rem; }
  .l-note { font: italic 400 1.4rem/1.3 var(--serif); color: var(--gold); margin-top: 0.8rem; min-height: 1.3em; }
  .l-ctrls { display: flex; gap: 1rem; align-items: center; }
  .l-ctrls .chip { background: rgba(8, 11, 19, 0.7); }
  .l-hint { font: 400 0.8rem/1 var(--mono); letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; margin-right: 1.4rem; }
  .l-hint kbd { font: inherit; color: var(--gold); border: 1px solid var(--gold-soft); padding: 0.2rem 0.45rem; margin: 0 0.2rem; }

  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 400 0.9rem/1 var(--mono); letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>

<div class="loading" id="loading">Preparing your room</div>

<!-- Welcome -->
<section class="view" id="welcome" aria-label="Welcome">
  <div class="w-hint">Use <kbd>◀ ▶</kbd> and <kbd>OK</kbd> on your remote</div>
  <div class="w-eyebrow">Elsewhere · In-room television</div>
  <h1 class="w-greeting" id="w-greeting">Good <em>evening.</em></h1>
  <div class="w-rule"></div>
  <div class="w-line" id="w-line">Tonight's television, from around the world.</div>
  <div class="w-meta" id="w-meta"></div>
  <div class="w-actions" id="w-actions"></div>
  <div class="w-clocks" id="w-clocks"></div>
</section>

<!-- Guide -->
<section class="view" id="guide" aria-label="Channel guide">
  <div class="g-top">
    <div class="brand">Elsewhere<span>The world's television</span></div>
    <div class="g-right">
      <div class="g-clock" id="g-clock"></div>
      <button class="chip" id="sound-chip" type="button"><span class="dot"></span><span id="sound-label">Sound on</span></button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="list" id="list"><div class="list-inner" id="list-inner"></div></div>
  <aside class="card" id="card"></aside>
  <div class="hint">
    <span><kbd>▲ ▼</kbd> browse &nbsp; <kbd>◀ ▶</kbd> region &nbsp; <kbd>OK</kbd> watch</span>
    <span class="status" id="feed-status"></span>
  </div>
</section>

<!-- Player -->
<section class="view" id="player" aria-label="Now playing">
  <div id="screen"></div>
  <div class="tuning" id="tuning">
    <div class="t-eyebrow" id="t-eyebrow"></div>
    <div class="t-name" id="t-name"></div>
    <div class="t-copy" id="t-copy"></div>
    <div class="t-actions" id="t-actions"></div>
    <div class="pulse" id="t-pulse"></div>
  </div>
  <div class="lower" id="lower">
    <div>
      <div class="l-num" id="l-num"></div>
      <div class="l-name" id="l-name"></div>
      <div class="l-meta" id="l-meta"></div>
      <div class="l-note" id="l-note"></div>
    </div>
    <div class="l-ctrls">
      <span class="l-hint"><kbd>▲ ▼</kbd> channel</span>
      <button class="chip" id="p-guide" type="button">Guide</button>
      <button class="chip" id="p-sound" type="button"><span class="dot"></span><span id="p-sound-label">Sound on</span></button>
    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  // ---------- configuration ----------
  // channels.json sits beside this page in the elsewhere-tv repo. The second
  // address lets a copy of the page opened elsewhere still find the guide.
  const CATALOG_URLS = ['./channels.json', 'https://nickcarbone.github.io/elsewhere-tv/channels.json'];
  const DEFAULT_FEED = 'https://nickcarbone.github.io/breaking-wall/news_sources.json';
  const FEED_TIMEOUT_MS = 6000;
  // Same order as the main Elsewhere TV page, so channel numbers match.
  const REGION_ORDER = ['Europe', 'Middle East', 'Africa', 'Asia', 'Pacific', 'North America', 'Latin America'];
  const TABS = [
    { label: 'Europe', regions: ['Europe'] },
    { label: 'Middle East', regions: ['Middle East'] },
    { label: 'Africa', regions: ['Africa'] },
    { label: 'Asia & Pacific', regions: ['Asia', 'Pacific'] },
    { label: 'The Americas', regions: ['North America', 'Latin America'] }
  ];
  const CLOCKS = [
    ['London', 'Europe/London'], ['Paris', 'Europe/Paris'], ['Dubai', 'Asia/Dubai'],
    ['Mumbai', 'Asia/Kolkata'], ['Tokyo', 'Asia/Tokyo'], ['São Paulo', 'America/Sao_Paulo']
  ];
  const TUNE_DELAY_MS = 450;     // wait for the remote to settle before loading a stream
  const BANNER_MS = 4500;
  const CONTROLS_MS = 7000;

  const KEY = {
    up: ['ArrowUp', 'Up', 38], down: ['ArrowDown', 'Down', 40], left: ['ArrowLeft', 'Left', 37], right: ['ArrowRight', 'Right', 39],
    ok: ['Enter', 13, ' ', 32], back: ['Escape', 'Esc', 'Backspace', 'GoBack', 'XF86Back', 27, 8, 10009, 461],
    chUp: ['PageUp', 'ChannelUp', 33, 427], chDown: ['PageDown', 'ChannelDown', 34, 428]
  };

  const $ = (id) => document.getElementById(id);
  const S = {
    view: 'loading', channels: [], tabs: [], tab: 0, row: 0, zone: 'list',
    welcomeIdx: 0, playerIdx: 1, current: null, soundOn: true, seq: 0,
    yt: null, ytRequested: false, forcedMute: false, muteWatch: null,
    tuneTimer: null, bannerTimer: null, controlsOpen: false, lastInput: 0
  };

  // ---------- helpers ----------
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };
  const recall = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const isExternal = (c) => c.embed === 'external' || (!c.channelId && !c.videoId);
  const matches = (e, list) => list.includes(e.key) || list.includes(e.keyCode);
  const videoIdOf = (url) => { const m = String(url || '').match(/(?:[?&]v=|youtu\.be\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{6,15})/); return m ? m[1] : null; };
  const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'the broadcaster’s site'; } };

  function timeIn(timeZone) {
    try {
      const now = new Date();
      const time = new Intl.DateTimeFormat('en-GB', { timeZone, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      const day = new Intl.DateTimeFormat('en-GB', { timeZone, weekday: 'long' }).format(now);
      return { time, hour: Number(time.slice(0, 2)) % 24, day };
    } catch (e) { return { time: '--:--', hour: 12, day: '' }; }
  }
  function daypart(h) { return h >= 5 && h < 12 ? 'Morning' : h >= 12 && h < 17 ? 'Afternoon' : h >= 17 && h < 23 ? 'Evening' : 'Late night'; }
  // A convention of television schedules, not a listing.
  function usually(c, h) {
    const g = c.genre;
    if (g === 'weather') return 'Forecasts and live weather maps';
    if (g === 'shopping') return 'Live product presentations';
    if (g === 'business') return h >= 6 && h < 18 ? 'Markets coverage while local exchanges trade' : 'Market wrap-ups and overseas sessions';
    const newsy = g === 'news' || g === 'local' || g === 'talk';
    if (h >= 5 && h < 9) return newsy ? 'Breakfast news and the morning headlines' : 'Breakfast television';
    if (h >= 9 && h < 12) return newsy ? 'Rolling morning coverage' : 'Morning magazine and talk shows';
    if (h >= 12 && h < 14) return newsy ? 'Lunchtime bulletins' : 'Midday news and lunchtime shows';
    if (h >= 14 && h < 17) return newsy ? 'Afternoon rolling news' : 'Afternoon dramas, repeats and talk';
    if (h >= 17 && h < 20) return newsy ? 'The early-evening news hour' : 'Early-evening news and game shows';
    if (h >= 20 && h < 23) return newsy ? 'Main evening bulletins and debate' : 'Prime time: dramas and variety';
    return newsy ? 'Overnight repeats and simulcasts' : 'Late-night repeats';
  }

  // ---------- data ----------
  function prepare(list) {
    const firstSeen = new Map();
    list.forEach((c, i) => { if (!firstSeen.has(c.country)) firstSeen.set(c.country, i); });
    const sorted = list.slice().sort((a, b) => {
      const ra = REGION_ORDER.indexOf(a.region), rb = REGION_ORDER.indexOf(b.region);
      if (ra !== rb) return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb);
      const ca = firstSeen.get(a.country), cb = firstSeen.get(b.country);
      if (ca !== cb) return ca - cb;
      const sa = a.service === 'international' ? 1 : 0, sb = b.service === 'international' ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return list.indexOf(a) - list.indexOf(b);
    });
    sorted.forEach((c, i) => { c.number = String(i + 1).padStart(3, '0'); c.feedState = null; });
    return sorted;
  }

  async function fetchJson(url, timeout) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout || 10000);
    try {
      const res = await fetch(url, { cache: 'no-cache', signal: ctl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  // Breaking Wall's validated feed refreshes rotated YouTube links. Identity
  // is the feed's stable `key`, exactly as on the main Elsewhere TV page.
  async function loadFeed(url) {
    try {
      const feed = await fetchJson(url + '?t=' + Date.now(), FEED_TIMEOUT_MS);
      if (!Array.isArray(feed)) throw new Error('bad feed');
      const byKey = new Map(feed.filter(e => e && e.key).map(e => [e.key, e]));
      let refreshed = 0;
      S.channels.forEach(c => {
        const entry = c.breakingWallKey && byKey.get(c.breakingWallKey);
        if (!entry) return;
        if (entry.status === 'live') {
          const id = videoIdOf(entry.url);
          if (id && id !== c.videoId) { c.videoId = id; refreshed++; }
          c.feedState = 'live';
        } else c.feedState = 'dead';
      });
      $('feed-status').textContent = 'Links current' + (refreshed ? ` · ${refreshed} refreshed` : '');
      if (S.view === 'guide') renderGuide();
    } catch (e) {
      $('feed-status').textContent = 'Using saved links';
    }
  }

  async function init() {
    S.soundOn = recall('elsewhereLiteSound') !== 'off';
    let data = null;
    for (const url of CATALOG_URLS) {
      try { data = await fetchJson(url); break; } catch (e) { /* try the next address */ }
    }
    if (!data) {
      $('loading').textContent = 'The channel guide could not be loaded';
      return;
    }
    S.channels = prepare(Array.isArray(data) ? data : data.channels || []);
    S.tabs = TABS.map(t => ({ label: t.label, list: S.channels.filter(c => t.regions.includes(c.region)) })).filter(t => t.list.length);
    const last = S.channels.find(c => c.id === recall('elsewhereLiteLast'));
    if (last) placeCursor(last);
    $('loading').remove();
    history.replaceState({ view: 'welcome' }, '');
    // Coming back from a broadcaster's site: return to the same place in the guide.
    let back = null;
    try { back = sessionStorage.getItem('elsewhereLiteReturn'); sessionStorage.removeItem('elsewhereLiteReturn'); } catch (e) { /* ignore */ }
    const returning = back && S.channels.find(c => c.id === back);
    if (returning) { placeCursor(returning); show('welcome'); go('guide'); }
    else show('welcome');
    setInterval(tick, 15000);
    loadFeed(data.breakingWallFeed || DEFAULT_FEED);
  }

  function placeCursor(c) {
    S.tabs.forEach((t, ti) => { const ri = t.list.indexOf(c); if (ri >= 0) { S.tab = ti; S.row = ri; } });
  }
  const focused = () => (S.tabs[S.tab] ? S.tabs[S.tab].list[S.row] : null);

  // ---------- views ----------
  function show(view) {
    S.view = view;
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === view));
    if (view === 'welcome') renderWelcome();
    if (view === 'guide') { stopPlayer(); renderGuide(); }
  }
  function go(view) {
    if (view === S.view) return;
    history.pushState({ view }, '');
    show(view);
  }
  window.addEventListener('popstate', (e) => {
    const view = (e.state && e.state.view) || 'welcome';
    if (view === 'player') {
      // Forward navigation into a player that was closed: return to the guide instead.
      history.replaceState({ view: 'guide' }, '');
      show('guide');
    } else show(view);
  });

  // ---------- welcome ----------
  function renderWelcome() {
    const h = new Date().getHours();
    const word = h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : 'evening';
    $('w-greeting').innerHTML = `Good <em>${word}.</em>`;
    const playable = S.channels.filter(c => !isExternal(c)).length;
    const countries = new Set(S.channels.map(c => c.country)).size;
    const now = new Date();
    const date = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    $('w-line').textContent = word === 'morning' ? 'This morning’s television, from around the world.'
      : word === 'afternoon' ? 'This afternoon’s television, from around the world.' : 'Tonight’s television, from around the world.';
    $('w-meta').textContent = `${date.toUpperCase()} · ${time}  —  ${S.channels.length} CHANNELS · ${countries} COUNTRIES · ${playable} PLAY HERE`;

    const box = $('w-actions');
    box.replaceChildren();
    const actions = [{ label: 'Enter', sub: 'The channel guide', run: () => go('guide') }];
    const last = S.channels.find(c => c.id === recall('elsewhereLiteLast'));
    if (last && !isExternal(last)) actions.push({ label: 'Resume', sub: `${last.name} · ${last.city || last.country}`, run: () => { placeCursor(last); go('guide'); watch(last); } });
    if (S.welcomeIdx >= actions.length) S.welcomeIdx = 0;
    actions.forEach((a, i) => {
      const b = el('button', 'w-btn' + (i === S.welcomeIdx ? ' focus' : ''), a.label);
      b.type = 'button';
      b.appendChild(el('small', null, a.sub));
      b.addEventListener('click', a.run);
      b.addEventListener('mouseenter', () => { S.welcomeIdx = i; renderWelcomeFocus(); });
      b._run = a.run;
      box.appendChild(b);
    });

    const clocks = $('w-clocks');
    clocks.replaceChildren();
    CLOCKS.forEach(([city, tz]) => { const d = el('div', 'w-clock', city); d.prepend(el('b', null, timeIn(tz).time)); clocks.appendChild(d); });
  }
  function renderWelcomeFocus() {
    [...$('w-actions').children].forEach((b, i) => b.classList.toggle('focus', i === S.welcomeIdx));
  }

  // ---------- guide ----------
  function renderGuide() {
    const tabs = $('tabs');
    tabs.replaceChildren();
    S.tabs.forEach((t, i) => {
      const b = el('button', 'tab' + (i === S.tab ? ' active' : '') + (i === S.tab && S.zone === 'tabs' ? ' focus' : ''), t.label);
      b.type = 'button';
      b.appendChild(el('sup', null, String(t.list.length)));
      b.addEventListener('click', () => { setTab(i); S.zone = 'list'; renderGuide(); });
      tabs.appendChild(b);
    });

    const inner = $('list-inner');
    inner.replaceChildren();
    const list = S.tabs[S.tab].list;
    let country = null;
    list.forEach((c, i) => {
      if (c.country !== country) {
        country = c.country;
        const head = el('div', 'country', c.country);
        head.appendChild(el('span', null, (c.countryCode || '').toUpperCase()));
        inner.appendChild(head);
      }
      const row = el('div', 'row' + (i === S.row && S.zone === 'list' ? ' focus' : '') + (isExternal(c) ? ' dim' : ''));
      row.dataset.i = i;
      row.appendChild(el('span', 'num', c.number));
      const name = el('span', 'name', c.name);
      if (c.service === 'international') name.appendChild(el('small', null, 'Intl'));
      row.appendChild(name);
      const meta = el('span', 'meta');
      if (isExternal(c)) meta.appendChild(el('span', 'tag', 'Opens site ↗'));
      else if (c.feedState === 'dead') meta.appendChild(el('span', 'tag', 'Reported down'));
      meta.appendChild(document.createTextNode(`${(c.city || '').toUpperCase()}  ${timeIn(c.timezone).time}`));
      row.appendChild(meta);
      row.addEventListener('mouseenter', () => { S.zone = 'list'; S.row = i; refreshFocus(); });
      row.addEventListener('click', () => { S.row = i; activate(c); });
      inner.appendChild(row);
    });

    renderSoundChips();
    $('sound-chip').classList.toggle('focus', S.zone === 'header');
    renderCard();
    renderClock();
    scrollToRow();
  }

  function refreshFocus() {
    [...$('list-inner').querySelectorAll('.row')].forEach(r => r.classList.toggle('focus', S.zone === 'list' && Number(r.dataset.i) === S.row));
    [...$('tabs').children].forEach((b, i) => b.classList.toggle('focus', S.zone === 'tabs' && i === S.tab));
    $('sound-chip').classList.toggle('focus', S.zone === 'header');
    renderCard();
    scrollToRow();
  }

  // Keeps the focused row in view without smooth scrolling, which stutters on TV chips.
  function scrollToRow() {
    const box = $('list'), inner = $('list-inner');
    const row = inner.querySelector(`.row[data-i="${S.row}"]`);
    if (!row) return;
    let offset = parseFloat(inner.dataset.offset || '0');
    const top = row.offsetTop, bottom = top + row.offsetHeight, h = box.clientHeight;
    const pad = row.offsetHeight * 1.5;
    if (S.row === 0) offset = 0;
    else if (top - pad < offset) offset = Math.max(0, top - pad);
    else if (bottom + pad > offset + h) offset = Math.min(inner.scrollHeight - h, bottom + pad - h);
    offset = Math.max(0, offset);
    inner.dataset.offset = offset;
    inner.style.transform = `translateY(${-offset}px)`;
  }

  function renderCard() {
    const c = focused();
    const card = $('card');
    card.replaceChildren();
    if (!c) return;
    const t = timeIn(c.timezone);
    card.appendChild(el('div', 'c-eyebrow', `CH ${c.number} · ${c.city ? c.city + ', ' : ''}${c.country}`));
    card.appendChild(el('h2', 'c-name', c.name));
    card.appendChild(el('div', 'c-cat', c.category || ''));
    const time = el('div', 'c-time');
    time.appendChild(el('b', null, t.time));
    time.appendChild(el('span', null, `${t.day} · ${daypart(t.hour)}`));
    card.appendChild(time);
    const facts = el('dl', 'c-facts');
    const add = (k, v) => { if (!v) return; facts.appendChild(el('dt', null, k)); facts.appendChild(el('dd', null, v)); };
    add('Language', c.language);
    add('Broadcaster', c.broadcaster);
    if (!isExternal(c)) add('Usually now', usually(c, t.hour));
    card.appendChild(facts);
    if (c.description) card.appendChild(el('p', 'c-desc', c.description));
    if (c.notice) card.appendChild(el('p', 'c-notice', c.notice));
    const foot = el('div', 'c-foot');
    const goLine = el('span', 'go');
    goLine.appendChild(el('kbd', null, 'OK'));
    goLine.appendChild(document.createTextNode(isExternal(c) ? `Opens ${hostOf(c.officialUrl)} · Back to return` : 'Watch'));
    foot.appendChild(goLine);
    foot.appendChild(el('span', null, c.service === 'international' ? 'International service' : 'Domestic channel'));
    card.appendChild(foot);
  }

  function renderClock() {
    const now = new Date();
    const clock = $('g-clock');
    clock.replaceChildren(document.createTextNode(now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })));
    clock.appendChild(el('small', null, now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })));
  }

  function setTab(i) {
    const n = S.tabs.length;
    S.tab = (i + n) % n;
    S.row = 0;
    $('list-inner').dataset.offset = '0';
  }

  function activate(c) {
    if (!c) return;
    if (isExternal(c)) {
      // Same window, so the remote's Back button returns here.
      if (!c.officialUrl) return;
      try { sessionStorage.setItem('elsewhereLiteReturn', c.id); } catch (e) { /* ignore */ }
      location.href = c.officialUrl;
      return;
    }
    watch(c);
  }

  // ---------- sound ----------
  function setSound(on) {
    S.soundOn = !!on;
    store('elsewhereLiteSound', S.soundOn ? 'on' : 'off');
    renderSoundChips();
  }
  function renderSoundChips() {
    const label = S.soundOn ? 'Sound on' : 'Sound off';
    $('sound-label').textContent = label; $('p-sound-label').textContent = label;
    $('sound-chip').classList.toggle('on', S.soundOn); $('p-sound').classList.toggle('on', S.soundOn);
  }
  function toggleSound() {
    setSound(S.forcedMute ? true : !S.soundOn);
    S.forcedMute = false;
    if (S.yt && S.yt.mute) {
      try { S.soundOn ? (S.yt.unMute(), S.yt.setVolume && S.yt.setVolume(100)) : S.yt.mute(); $('l-note').textContent = ''; return; } catch (e) { /* fall back to reload */ }
    }
    if (S.view === 'player' && S.current) loadStream(S.current, ++S.seq);
  }

  // ---------- player ----------
  const playable = () => S.channels.filter(c => !isExternal(c));

  function watch(c) {
    S.current = c;
    store('elsewhereLiteLast', c.id);
    placeCursor(c);
    if (S.view !== 'player') { history.pushState({ view: 'player' }, ''); S.view = 'player'; document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'player')); }
    tune(c, 0);
  }

  function flip(dir) {
    const list = playable();
    if (!list.length) return;
    const i = list.indexOf(S.current);
    const next = list[((i < 0 ? 0 : i + dir) + list.length) % list.length];
    S.current = next;
    store('elsewhereLiteLast', next.id);
    placeCursor(next);
    tune(next, TUNE_DELAY_MS);
  }

  function tune(c, delay) {
    const seq = ++S.seq;
    clearScreen();
    showTuning(c, 'Tuning', `${c.city || c.country} · ${timeIn(c.timezone).time} local time`, true);
    if (S.controlsOpen) showBanner(c, true); else hideBanner();
    clearTimeout(S.tuneTimer);
    S.tuneTimer = setTimeout(() => { if (seq === S.seq) loadStream(c, seq); }, delay);
  }

  // The picture has arrived: lift the tuning card and introduce the channel.
  function reveal(c) {
    if ($('tuning').classList.contains('gone')) return;
    $('tuning').classList.add('gone');
    showBanner(c, S.controlsOpen);
  }

  function showTuning(c, eyebrow, copy, busy, actions) {
    $('t-eyebrow').textContent = `CH ${c.number} · ${eyebrow}`;
    $('t-name').textContent = c.name;
    $('t-copy').textContent = copy;
    $('t-actions').innerHTML = actions || '';
    $('t-pulse').style.display = busy ? '' : 'none';
    $('tuning').classList.remove('gone');
  }

  function showBanner(c, keepOpen) {
    const t = timeIn(c.timezone);
    $('l-num').textContent = `CH ${c.number}`;
    $('l-name').textContent = c.name;
    $('l-meta').textContent = [c.city || c.country, c.country !== c.city ? c.country : null, t.time, c.language].filter(Boolean).join(' · ');
    if (!S.forcedMute) $('l-note').textContent = '';
    $('lower').classList.add('show');
    clearTimeout(S.bannerTimer);
    S.bannerTimer = setTimeout(hideBanner, keepOpen ? CONTROLS_MS : BANNER_MS);
    renderPlayerFocus();
  }
  function hideBanner() { $('lower').classList.remove('show'); S.controlsOpen = false; renderPlayerFocus(); }
  function openControls() { S.controlsOpen = true; showBanner(S.current, true); }
  function renderPlayerFocus() {
    $('p-guide').classList.toggle('focus', S.controlsOpen && S.playerIdx === 0);
    $('p-sound').classList.toggle('focus', S.controlsOpen && S.playerIdx === 1);
  }

  function embedSrc(c, mode) {
    const p = new URLSearchParams({
      autoplay: '1', mute: S.soundOn ? '0' : '1', controls: '0', playsinline: '1', rel: '0',
      enablejsapi: '1', iv_load_policy: '3', disablekb: '1', fs: '0', cc_load_policy: '0'
    });
    if (/^https?:/.test(location.origin)) p.set('origin', location.origin);
    if (mode === 'channel') { p.set('channel', c.channelId); return 'https://www.youtube.com/embed/live_stream?' + p; }
    return `https://www.youtube.com/embed/${encodeURIComponent(c.videoId)}?${p}`;
  }
  // Which embed to try first, and what to fall back to if it errors.
  function embedPlan(c) {
    const hasChannel = /^UC[\w-]{22}$/.test(c.channelId || '');
    const modes = [];
    if (c.embed === 'channel' && hasChannel) modes.push('channel');
    if (c.videoId) modes.push('video');
    if (hasChannel && !modes.includes('channel')) modes.push('channel');
    return modes;
  }

  function clearScreen() {
    clearInterval(S.muteWatch); S.muteWatch = null;
    if (S.yt && S.yt.destroy) { try { S.yt.destroy(); } catch (e) { /* already gone */ } }
    S.yt = null;
    $('screen').replaceChildren();
  }
  function stopPlayer() { S.seq++; clearTimeout(S.tuneTimer); clearScreen(); hideBanner(); }

  function loadStream(c, seq) { startEmbed(c, embedPlan(c), 0, seq); }

  function startEmbed(c, plan, index, seq) {
    if (seq !== S.seq) return;
    if (index >= plan.length) { showUnavailable(c); return; }
    clearScreen();
    const frame = document.createElement('iframe');
    frame.title = `${c.name} live`;
    frame.allow = 'autoplay; encrypted-media';
    frame.tabIndex = -1;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.src = embedSrc(c, plan[index]);
    $('screen').appendChild(frame);
    ensureYtApi();
    attachApi(frame, c, plan, index, seq);
    // If YouTube never reports playback, lift the tuning card anyway so its own message shows.
    setTimeout(() => { if (seq === S.seq && !$('tuning').classList.contains('gone')) reveal(c); }, 9000);
  }

  function ensureYtApi() {
    if (S.ytRequested || (window.YT && window.YT.Player)) return;
    S.ytRequested = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.async = true;
    document.head.appendChild(tag);
  }
  function attachApi(frame, c, plan, index, seq) {
    const bind = () => {
      if (seq !== S.seq || !frame.isConnected || !(window.YT && window.YT.Player)) return;
      try {
        S.yt = new window.YT.Player(frame, {
          events: {
            onReady: (e) => { if (seq === S.seq) onReady(e.target, seq); },
            onError: () => { if (seq === S.seq) startEmbed(c, plan, index + 1, seq); },
            onStateChange: (e) => { if (seq === S.seq && e.data === 1) reveal(c); }
          }
        });
      } catch (e) { /* the plain iframe keeps working without the API */ }
    };
    if (window.YT && window.YT.Player) bind();
    else {
      const previous = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (typeof previous === 'function') previous(); bind(); };
    }
  }
  function onReady(player, seq) {
    try { if (S.soundOn) { player.unMute(); player.setVolume(100); } player.playVideo(); } catch (e) { /* ignore */ }
    // If the browser refuses to start with sound, play muted and say so; the preference is kept.
    setTimeout(() => {
      if (seq !== S.seq || !S.soundOn) return;
      try {
        const state = player.getPlayerState();
        if (state !== 1 && state !== 3) {
          S.forcedMute = true; player.mute(); player.playVideo();
          $('l-note').textContent = 'The browser held back the sound. Press OK, then choose Sound on.';
          openControls();
        }
      } catch (e) { /* ignore */ }
    }, 2500);
    S.muteWatch = setInterval(() => {
      if (seq !== S.seq || S.forcedMute) return;
      try { const muted = player.isMuted(); if (muted === S.soundOn) setSound(!muted); } catch (e) { /* ignore */ }
    }, 1500);
  }

  function showUnavailable(c) {
    clearScreen();
    showTuning(c, 'Off air here', 'This channel isn’t broadcasting here just now. It may be between programmes or closed to other sites.', false,
      '<kbd>▲ ▼</kbd> next channel &nbsp; <kbd>Back</kbd> guide');
  }

  // ---------- clock tick ----------
  function tick() {
    if (S.view === 'welcome') renderWelcome();
    if (S.view === 'guide') {
      renderClock();
      renderCard();
      [...$('list-inner').querySelectorAll('.row')].forEach(r => {
        const c = S.tabs[S.tab].list[Number(r.dataset.i)];
        const meta = r.querySelector('.meta');
        if (c && meta && meta.lastChild) meta.lastChild.textContent = `${(c.city || '').toUpperCase()}  ${timeIn(c.timezone).time}`;
      });
    }
  }

  // ---------- remote control ----------
  document.addEventListener('keydown', (e) => {
    if (S.view === 'loading') return;
    const k = (list) => matches(e, list);
    let handled = true;

    if (k(KEY.back)) {
      if (S.view === 'player' && S.controlsOpen) hideBanner();
      else if (S.view === 'welcome') handled = false;   // let the browser leave the page
      else history.back();
    } else if (S.view === 'welcome') {
      const btns = [...$('w-actions').children];
      if (k(KEY.left)) S.welcomeIdx = Math.max(0, S.welcomeIdx - 1);
      else if (k(KEY.right)) S.welcomeIdx = Math.min(btns.length - 1, S.welcomeIdx + 1);
      else if (k(KEY.ok)) { const b = btns[S.welcomeIdx]; if (b) b._run(); }
      else handled = false;
      if (S.view === 'welcome') renderWelcomeFocus();
    } else if (S.view === 'guide') {
      const list = S.tabs[S.tab].list;
      if (S.zone === 'list') {
        if (k(KEY.up)) { if (S.row > 0) S.row--; else S.zone = 'tabs'; refreshFocus(); }
        else if (k(KEY.down)) { S.row = Math.min(list.length - 1, S.row + 1); refreshFocus(); }
        else if (k(KEY.chUp)) { S.row = Math.max(0, S.row - 8); refreshFocus(); }
        else if (k(KEY.chDown)) { S.row = Math.min(list.length - 1, S.row + 8); refreshFocus(); }
        else if (k(KEY.left)) { setTab(S.tab - 1); renderGuide(); }
        else if (k(KEY.right)) { setTab(S.tab + 1); renderGuide(); }
        else if (k(KEY.ok)) activate(focused());
        else handled = false;
      } else if (S.zone === 'tabs') {
        if (k(KEY.left)) { setTab(S.tab - 1); renderGuide(); }
        else if (k(KEY.right)) { setTab(S.tab + 1); renderGuide(); }
        else if (k(KEY.down) || k(KEY.ok)) { S.zone = 'list'; refreshFocus(); }
        else if (k(KEY.up)) { S.zone = 'header'; refreshFocus(); }
        else handled = false;
      } else {
        if (k(KEY.down)) { S.zone = 'tabs'; refreshFocus(); }
        else if (k(KEY.ok)) toggleSound();
        else handled = false;
      }
    } else if (S.view === 'player') {
      if (k(KEY.up) || k(KEY.chUp)) { S.controlsOpen = false; flip(1); }
      else if (k(KEY.down) || k(KEY.chDown)) { S.controlsOpen = false; flip(-1); }
      else if (k(KEY.ok)) {
        if (!S.controlsOpen) openControls();
        else if (S.playerIdx === 0) history.back();
        else { toggleSound(); openControls(); }
      }
      else if (k(KEY.left) || k(KEY.right)) {
        if (!S.controlsOpen) openControls();
        else { S.playerIdx = k(KEY.left) ? 0 : 1; openControls(); }
      }
      else handled = false;
    }
    if (handled) e.preventDefault();
  });

  // Pointer support for the TV's cursor mode or a computer.
  $('sound-chip').addEventListener('click', toggleSound);
  $('p-sound').addEventListener('click', () => { toggleSound(); openControls(); });
  $('p-guide').addEventListener('click', () => history.back());
  $('player').addEventListener('mousemove', () => { if (S.view === 'player') openControls(); });
  $('player').addEventListener('click', (e) => { if (e.target.closest('button')) return; openControls(); });
  // Mouse wheel scrolls the guide.
  $('list').addEventListener('wheel', (e) => {
    const list = S.tabs[S.tab].list;
    S.zone = 'list';
    S.row = Math.max(0, Math.min(list.length - 1, S.row + (e.deltaY > 0 ? 1 : -1)));
    refreshFocus();
    e.preventDefault();
  }, { passive: false });

  init();
})();
</script>
</body>
</html>
